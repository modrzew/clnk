name: Apps

on:
  # Releases published by hand. The release workflow calls this directly instead.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        type: string
        required: true

permissions:
  contents: write

jobs:
  # Apple Silicon only. Ad-hoc signed, not notarized.
  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      # Signs the update package; the matching public key is in src-tauri/tauri.conf.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the updater signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the app can't be signed for auto-update"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # With bundle.createUpdaterArtifacts the build also packs the .app into a signed
      # .app.tar.gz for the updater. It only does that when the app bundle is a target,
      # and without it the build deletes the .app after making the .dmg.
      - run: bun tauri build --target aarch64-apple-darwin --bundles app,dmg

      # The updater finds the archive and its signature through the latest.json manifest.
      - name: Write the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          macos=src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          archive="clnk_${version}_aarch64.app.tar.gz"
          mv "$macos/clnk.app.tar.gz" "$macos/$archive"
          mv "$macos/clnk.app.tar.gz.sig" "$macos/$archive.sig"
          notes=$(gh release view "$TAG" --json body -q .body)
          published=$(gh release view "$TAG" --json publishedAt -q .publishedAt)
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$published" \
            --arg url "https://github.com/modrzew/clnk/releases/download/$TAG/$archive" \
            --arg signature "$(cat "$macos/$archive.sig")" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {url: $url, signature: $signature}}}' \
            > "$macos/latest.json"

      - name: Attach the .dmg and the updater artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          gh release upload "$TAG" \
            "$bundle"/dmg/*.dmg \
            "$bundle"/macos/*.app.tar.gz \
            "$bundle"/macos/*.app.tar.gz.sig \
            --clobber
          # Last, so the app never finds a manifest pointing at an archive that isn't there yet.
          gh release upload "$TAG" "$bundle/macos/latest.json" --clobber

  # 64-bit ARM only, which is what current phones run.
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile

      # The runner comes with the Android SDK and NDKs. Gradle installs the SDK platform it needs.
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing, so the APK can't be signed"
            exit 1
          fi
          # The runner empties its temp folder after the job.
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" bun tauri android build --apk --target aarch64

      - name: Attach the .apk to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="clnk_${TAG#v}_aarch64.apk"
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner" verify "$apk"
          gh release upload "$TAG" "$apk" --clobber
