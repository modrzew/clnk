<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>clnk</title>
    <script>
      // The colours arrive with the app. Until then the page shouldn't flash the system's theme.
      try {
        const { theme } = JSON.parse(localStorage.getItem("clnk.settings"));
        if (theme === "light" || theme === "dark")
          document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
